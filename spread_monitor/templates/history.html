{% extends "base.html" %} {% block title %}History - Spread Monitor{% endblock
%} {% block content %}
<h2 class="mb-4">Spread History</h2>

<div class="card mb-4">
  <div class="card-body">
    <form class="row g-3 align-items-end" id="dateForm">
      <div class="col-md-3">
        <label for="startDate" class="form-label">Start Date</label>
        <input type="date" class="form-control" id="startDate" required />
      </div>
      <div class="col-md-3">
        <label for="endDate" class="form-label">End Date</label>
        <input type="date" class="form-control" id="endDate" required />
      </div>
      <div class="col-md-3">
        <label for="symbol" class="form-label">Symbol</label>
        <select class="form-select" id="symbol">
          <!-- Populated dynamically from config -->
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Load Data</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Spread Over Time</h5>
    <div class="d-flex gap-2">
      <div class="btn-group btn-group-sm" role="group">
        <button
          type="button"
          class="btn btn-outline-secondary active"
          onclick="setYAxis('points')"
        >
          Points
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="setYAxis('spread')"
        >
          Price
        </button>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button
          type="button"
          class="btn btn-outline-secondary active"
          id="scaleAuto"
          onclick="setScaleMode('auto')"
        >
          Auto Scale
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          id="scaleFull"
          onclick="setScaleMode('full')"
        >
          Full Range
        </button>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button
          type="button"
          class="btn btn-outline-secondary active"
          id="zoom1d"
          onclick="setZoom(1)"
        >
          1D
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          id="zoom3d"
          onclick="setZoom(3)"
        >
          3D
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          id="zoom7d"
          onclick="setZoom(7)"
        >
          7D
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          id="zoomAll"
          onclick="setZoom(0)"
        >
          All
        </button>
      </div>
    </div>
  </div>
  <div class="card-body" style="position: relative">
    <div
      id="hoverOverlay"
      style="
        position: absolute;
        top: 8px;
        left: 100px;
        z-index: 10;
        pointer-events: none;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.6;
        text-align: left;
        opacity: 0;
        transition: opacity 0.15s;
        background: var(--hover-overlay-bg, rgba(255, 255, 255, 0.85));
        padding: 6px 10px;
        border-radius: 4px;
      "
    ></div>
    <div id="historyChart" class="chart-container"></div>
  </div>
</div>

<div class="card mt-4">
  <div class="card-header">
    <h5 class="mb-0">Data Summary</h5>
  </div>
  <div class="card-body">
    <div id="dataSummary">
      <p class="text-muted">Load data to see summary statistics.</p>
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
  let chartData = null
  let currentYAxis = 'points'
  let scaleMode = 'auto' // 'auto' = 99th percentile cap, 'full' = show all
  let zoomDays = 1 // 0 = show all, otherwise number of days visible
  let collectionInterval = 5 // Default, will be fetched from config

  async function loadConfig() {
    try {
      const response = await fetch('/api/config')
      const result = await response.json()
      if (result.success) {
        collectionInterval = result.data.collection_interval_minutes
        populateSymbols(result.data.symbols || ['XAUUSD'])
      }
    } catch (error) {
      console.error('Error fetching config:', error)
      populateSymbols(['XAUUSD']) // Fallback
    }
  }

  function populateSymbols(symbols) {
    const select = document.getElementById('symbol')
    select.innerHTML = symbols
      .map(
        (s, i) =>
          `<option value="${s}"${i === 0 ? ' selected' : ''}>${s}</option>`
      )
      .join('')
  }

  // Set default dates (today and 7 days ago)
  function setDefaultDates() {
    const today = new Date()
    const weekAgo = new Date(today)
    weekAgo.setDate(weekAgo.getDate() - 7)

    document.getElementById('endDate').value = today.toISOString().split('T')[0]
    document.getElementById('startDate').value = weekAgo
      .toISOString()
      .split('T')[0]
  }

  function setYAxis(type) {
    currentYAxis = type
    event.target
      .closest('.btn-group')
      .querySelectorAll('.btn')
      .forEach((btn) => {
        btn.classList.remove('active')
      })
    event.target.classList.add('active')
    if (chartData) {
      renderChart(chartData)
    }
  }

  function setScaleMode(mode) {
    scaleMode = mode
    document
      .getElementById('scaleAuto')
      .classList.toggle('active', mode === 'auto')
    document
      .getElementById('scaleFull')
      .classList.toggle('active', mode === 'full')
    if (chartData) {
      renderChart(chartData)
    }
  }

  function setZoom(days) {
    zoomDays = days
    document.getElementById('zoom1d').classList.toggle('active', days === 1)
    document.getElementById('zoom3d').classList.toggle('active', days === 3)
    document.getElementById('zoom7d').classList.toggle('active', days === 7)
    document.getElementById('zoomAll').classList.toggle('active', days === 0)
    if (chartData) {
      renderChart(chartData)
    }
  }

  function percentile(arr, p) {
    const sorted = [...arr].sort((a, b) => a - b)
    const idx = (p / 100) * (sorted.length - 1)
    const lower = Math.floor(idx)
    const upper = Math.ceil(idx)
    if (lower === upper) return sorted[lower]
    return sorted[lower] + (sorted[upper] - sorted[lower]) * (idx - lower)
  }

  function findDataGaps(data) {
    // Find gaps where entire days are missing (weekends, deleted files, etc.)
    // Only compress when the gap spans non-consecutive calendar dates,
    // so intra-day outages are shown as-is (flat lines).
    const timestamps = [...new Set(data.map((d) => d.timestamp))].sort()
    const gaps = []

    for (let i = 1; i < timestamps.length; i++) {
      const prevDate = new Date(timestamps[i - 1])
      const currDate = new Date(timestamps[i])

      // Get calendar dates (YYYY-MM-DD)
      const prevDay = timestamps[i - 1].split(' ')[0]
      const currDay = timestamps[i].split(' ')[0]

      // Check if there are missing calendar days between the two points
      const prevDayEnd = new Date(prevDay + 'T23:59:59')
      const currDayStart = new Date(currDay + 'T00:00:00')
      const daysBetween = Math.floor(
        (currDayStart - prevDayEnd) / (1000 * 60 * 60 * 24)
      )

      if (prevDay !== currDay && daysBetween >= 1) {
        gaps.push({
          lastBefore: timestamps[i - 1],
          firstAfter: timestamps[i]
        })
      }
    }

    return gaps
  }

  function renderChart(data) {
    if (!data || data.length === 0) {
      document.getElementById('historyChart').innerHTML =
        '<p class="text-center text-muted py-5">No data available for the selected date range.</p>'
      return
    }

    // Group data by broker
    const brokers = [...new Set(data.map((d) => d.broker))]

    // Gap threshold: if two consecutive points for a broker are more than
    // 6x the collection interval apart, break the line (show blank space).
    const gapThreshold = collectionInterval * 6 * 60 * 1000

    const traces = brokers.map((broker) => {
      const brokerData = data
        .filter((d) => d.broker === broker)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))

      const x = []
      const y = []

      for (let i = 0; i < brokerData.length; i++) {
        if (i > 0) {
          const prev = new Date(brokerData[i - 1].timestamp)
          const curr = new Date(brokerData[i].timestamp)
          if (curr - prev > gapThreshold) {
            // Insert null to break the line at the gap
            x.push(brokerData[i - 1].timestamp)
            y.push(null)
          }
        }
        x.push(brokerData[i].timestamp)
        y.push(
          currentYAxis === 'points'
            ? brokerData[i].spread_points
            : brokerData[i].spread
        )
      }

      return {
        x,
        y,
        type: 'scatter',
        mode: 'lines',
        name: broker,
        connectgaps: false,
        line: {
          color: getBrokerColor(broker),
          width: 1.5,
          shape: 'spline',
          smoothing: 0.8
        },
        hoverinfo: 'none'
      }
    })

    // Find data gaps for rangebreaks (compress weekends, missing days, etc.)
    const dataGaps = findDataGaps(data)

    // Compute y-axis upper bound
    const yValues = data.map((d) =>
      currentYAxis === 'points' ? d.spread_points : d.spread
    )
    const yMax = Math.max(...yValues)
    const p99 = percentile(yValues, 99)
    const yUpperBound =
      scaleMode === 'auto'
        ? p99 * 1.2 + 1 // 95th percentile + 30% padding (clips rollover spikes)
        : yMax * 1.1 + 1 // Full range with 10% padding
    // Floor padding: -5 for points mode, proportional for price mode
    const yFloor = currentYAxis === 'points' ? -5 : -(yUpperBound * 0.1)

    const symbol = document.getElementById('symbol').value
    const interval = collectionInterval + 'm'

    // Compute x-axis boundaries from the data
    const allTimestamps = data.map((d) => d.timestamp).sort()
    const xMin = allTimestamps[0]
    const xMax = allTimestamps[allTimestamps.length - 1]

    // Visible window: show last N days, or all if zoomDays === 0
    let xRangeStart = xMin
    if (zoomDays > 0) {
      const maxDate = new Date(xMax)
      const windowStart = new Date(
        maxDate.getTime() - zoomDays * 24 * 60 * 60 * 1000
      )
      const windowStartStr = windowStart
        .toISOString()
        .replace('T', ' ')
        .slice(0, 19)
      // Don't go before the data start
      xRangeStart = windowStartStr > xMin ? windowStartStr : xMin
    }

    const themeLayout = getPlotlyThemeLayout()
    const isDark =
      document.documentElement.getAttribute('data-bs-theme') === 'dark'
    const spikeColor = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.3)'

    const layout = {
      ...themeLayout,
      xaxis: {
        ...themeLayout.xaxis,
        title: 'Time',
        type: 'date',
        autorange: false,
        range: [xRangeStart, xMax],
        // Compress gaps (weekends, missing days) so chart appears continuous
        rangebreaks: dataGaps.map((g) => ({
          bounds: [g.lastBefore, g.firstAfter]
        })),
        showspikes: true,
        spikemode: 'across',
        spikethickness: 1,
        spikecolor: spikeColor,
        spikedash: 'dot'
      },
      yaxis: {
        ...themeLayout.yaxis,
        title: currentYAxis === 'points' ? 'Spread (Points)' : 'Spread (Price)',
        rangemode: 'normal',
        autorange: false,
        range: [yFloor, yUpperBound],
        fixedrange: true
      },
      legend: {
        orientation: 'h',
        y: -0.2
      },
      margin: { t: 40, r: 20 },
      hovermode: 'x',
      spikedistance: -1,
      dragmode: 'pan',
      annotations: [
        {
          text: `${symbol} · ${interval}`,
          xref: 'paper',
          yref: 'paper',
          x: 0.5,
          y: 0.98,
          showarrow: false,
          font: {
            size: 35,
            color: 'rgba(150, 150, 150, 0.2)',
            family: 'Arial Black, sans-serif'
          },
          xanchor: 'center',
          yanchor: 'top'
        }
      ]
    }

    const config = {
      responsive: true,
      displayModeBar: true,
      modeBarButtonsToRemove: ['lasso2d', 'select2d'],
      scrollZoom: true
    }

    Plotly.newPlot('historyChart', traces, layout, config)

    const chartEl = document.getElementById('historyChart')
    const overlay = document.getElementById('hoverOverlay')
    const unit = currentYAxis === 'points' ? ' pts' : ''

    chartEl.on('plotly_hover', function (eventData) {
      if (!eventData.points || eventData.points.length === 0) return

      const date = new Date(eventData.points[0].x)
      const timeStr =
        date.getFullYear() +
        '-' +
        String(date.getMonth() + 1).padStart(2, '0') +
        '-' +
        String(date.getDate()).padStart(2, '0') +
        ' ' +
        String(date.getHours()).padStart(2, '0') +
        ':' +
        String(date.getMinutes()).padStart(2, '0')

      // All traces at this x position (hovermode 'x' gives all)
      const entries = eventData.points
        .filter((p) => p.y != null)
        .map((p) => ({
          name: p.data.name,
          color: p.data.line.color,
          value: p.y
        }))
        .sort((a, b) => b.value - a.value)

      let html = `<span style="color:var(--text-muted-custom, #888)">${timeStr}</span><br>`
      entries.forEach((e) => {
        const val = Number.isInteger(e.value) ? e.value : e.value.toFixed(2)
        html += `<span style="color:${e.color}"><b>${e.name}:</b> ${val}${unit}</span><br>`
      })

      overlay.innerHTML = html
      overlay.style.opacity = '1'
    })

    chartEl.on('plotly_unhover', function () {
      overlay.style.opacity = '0'
    })
  }

  function renderSummary(data) {
    if (!data || data.length === 0) {
      document.getElementById('dataSummary').innerHTML =
        '<p class="text-muted">No data available.</p>'
      return
    }

    const brokers = [...new Set(data.map((d) => d.broker))]
    let html = '<div class="row">'

    brokers.forEach((broker) => {
      const brokerData = data.filter((d) => d.broker === broker)
      const spreads = brokerData.map((d) => d.spread_points)
      const avg = (spreads.reduce((a, b) => a + b, 0) / spreads.length).toFixed(
        1
      )
      const min = Math.min(...spreads)
      const max = Math.max(...spreads)

      html += `
                <div class="col-md-4 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h6>${broker}</h6>
                            <p class="mb-0 small">
                                <strong>Records:</strong> ${brokerData.length} |
                                <strong>Avg:</strong> ${avg} |
                                <strong>Min:</strong> ${min} |
                                <strong>Max:</strong> ${max}
                            </p>
                        </div>
                    </div>
                </div>
            `
    })

    html += '</div>'
    document.getElementById('dataSummary').innerHTML = html
  }

  async function loadHistory() {
    const startDate = document.getElementById('startDate').value
    const endDate = document.getElementById('endDate').value
    const symbol = document.getElementById('symbol').value

    try {
      const response = await fetch(
        `/api/history?start=${startDate}&end=${endDate}&symbol=${symbol}`
      )
      const result = await response.json()

      if (result.success) {
        chartData = result.data
        renderChart(chartData)
        renderSummary(chartData)
      } else {
        console.error('Error:', result.error)
      }
    } catch (error) {
      console.error('Error fetching history:', error)
    }
  }

  // Event listeners
  document.getElementById('dateForm').addEventListener('submit', function (e) {
    e.preventDefault()
    loadHistory()
  })

  // Initialize
  async function init() {
    await loadConfig()
    setDefaultDates()
    loadHistory()
  }

  init()
</script>
{% endblock %}
