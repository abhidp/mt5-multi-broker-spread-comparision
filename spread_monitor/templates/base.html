<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Spread Monitor{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
      /* CSS Variables for theming */
      :root {
        --bg-card: #ffffff;
        --text-muted-custom: #6c757d;
        --table-header-bg: #f8f9fa;
        --hover-bg: #e9ecef;
        --chart-bg: #ffffff;
        --chart-text: #333333;
        /* --chart-grid: #e0e0e0; */
        --hover-overlay-bg: rgba(255, 255, 255, 0.85);
      }
      [data-bs-theme='dark'] {
        --bg-card: #212529;
        --text-muted-custom: #adb5bd;
        --table-header-bg: #343a40;
        --hover-bg: #495057;
        --chart-bg: #212529;
        --chart-text: #e9ecef;
        --chart-grid: #495057;
        --hover-overlay-bg: rgba(33, 37, 41, 0.85);
      }
      .navbar-brand {
        font-weight: bold;
      }
      .spread-card {
        transition: transform 0.2s;
      }
      .spread-card:hover {
        transform: translateY(-2px);
      }
      .spread-lowest {
        border-left: 4px solid #198754;
      }
      .spread-highest {
        border-left: 4px solid #dc3545;
      }
      .spread-mid {
        border-left: 4px solid #ffc107;
      }
      .spread-value {
        font-size: 2rem;
        font-weight: bold;
      }
      .spread-points {
        font-size: 1.2rem;
        color: var(--text-muted-custom);
      }
      .last-updated {
        font-size: 0.85rem;
        color: var(--text-muted-custom);
      }
      .chart-container {
        min-height: 500px;
      }
      .stats-table th {
        background-color: var(--table-header-bg);
      }
      .recommendation-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      /* Theme toggle button */
      .theme-toggle {
        background: none;
        border: none;
        padding: 0.5rem;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.85);
        transition: color 0.2s;
      }
      .theme-toggle:hover {
        color: #ffffff;
      }
      .theme-toggle svg {
        width: 20px;
        height: 20px;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Spread Monitor</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                href="{{ url_for('index') }}"
                >Live</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'history' %}active{% endif %}"
                href="{{ url_for('history') }}"
                >History</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'stats' %}active{% endif %}"
                href="{{ url_for('stats') }}"
                >Statistics</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'sessions' %}active{% endif %}"
                href="{{ url_for('sessions') }}"
                >Sessions</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'costs' %}active{% endif %}"
                href="{{ url_for('costs') }}"
                >Costs</a
              >
            </li>
          </ul>
          <button
            class="theme-toggle ms-auto"
            id="themeToggle"
            onclick="toggleTheme()"
            title="Toggle dark mode"
          >
            <svg
              id="sunIcon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              style="display: none"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
            <svg
              id="moonIcon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <main class="container mt-4">{% block content %}{% endblock %}</main>

    <footer class="container mt-5 mb-3">
      <hr />
      <p class="text-muted text-center small">
        MT5 Spread Monitor - Comparing spreads across brokers
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Theme Management
      function getStoredTheme() {
        return localStorage.getItem('theme')
      }

      function setStoredTheme(theme) {
        localStorage.setItem('theme', theme)
      }

      function getPreferredTheme() {
        const storedTheme = getStoredTheme()
        if (storedTheme) {
          return storedTheme
        }
        // Default to light mode
        return 'light'
      }

      function setTheme(theme) {
        document.documentElement.setAttribute('data-bs-theme', theme)
        updateThemeIcon(theme)
        updatePlotlyCharts()
      }

      function updateThemeIcon(theme) {
        const sunIcon = document.getElementById('sunIcon')
        const moonIcon = document.getElementById('moonIcon')
        if (sunIcon && moonIcon) {
          if (theme === 'dark') {
            sunIcon.style.display = 'block'
            moonIcon.style.display = 'none'
          } else {
            sunIcon.style.display = 'none'
            moonIcon.style.display = 'block'
          }
        }
      }

      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute('data-bs-theme')
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
        setStoredTheme(newTheme)
        setTheme(newTheme)
      }

      // Get Plotly layout based on current theme
      function getPlotlyThemeLayout() {
        const isDark =
          document.documentElement.getAttribute('data-bs-theme') === 'dark'
        return {
          paper_bgcolor: isDark ? '#212529' : '#ffffff',
          plot_bgcolor: isDark ? '#212529' : '#ffffff',
          font: {
            color: isDark ? '#e9ecef' : '#333333'
          },
          xaxis: {
            gridcolor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.02)',
            linecolor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,1)',
            zerolinecolor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'
          },
          yaxis: {
            gridcolor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.02)',
            linecolor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,1)',
            zerolinecolor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'
          },
          coloraxis: {
            colorbar: {
              tickcolor: isDark ? '#e9ecef' : '#333333',
              tickfont: { color: isDark ? '#e9ecef' : '#333333' }
            }
          }
        }
      }

      // Update all Plotly charts on the page with current theme
      function updatePlotlyCharts() {
        const plotlyDivs = document.querySelectorAll('.js-plotly-plot')
        const themeLayout = getPlotlyThemeLayout()
        plotlyDivs.forEach((div) => {
          if (div.data) {
            Plotly.relayout(div, themeLayout)
          }
        })
      }

      // Initialize theme on page load (before content renders)
      setTheme(getPreferredTheme())

      // Base URL prefix for API calls (supports reverse proxy path routing)
      const BASE_URL = "{{ request.script_root }}"

      // Global broker color mapping for consistent colors across all charts
      const BROKER_COLORS = {
        'Pepperstone Razor': '#0d6efd', // Blue
        'FusionMarkets Zero': '#198754', // Green
        'ThinkMarkets ThinkZero': '#dc3545', // Red
        'ICMarkets Raw': '#ffc107', // Yellow/Amber
        'VantageMarkets Raw': '#6f42c1', // Purple
        'FPMarkets Raw': '#fd7e14' // Orange
      }

      // Fallback colors for any brokers not in the mapping
      const FALLBACK_COLORS = [
        '#20c997',
        '#e83e8c',
        '#17a2b8',
        '#6610f2',
        '#28a745',
        '#007bff'
      ]
      let fallbackIndex = 0

      function getBrokerColor(brokerName) {
        if (BROKER_COLORS[brokerName]) {
          return BROKER_COLORS[brokerName]
        }
        // Assign a fallback color for unknown brokers
        const color = FALLBACK_COLORS[fallbackIndex % FALLBACK_COLORS.length]
        fallbackIndex++
        return color
      }
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
